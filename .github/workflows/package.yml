name: Package early-access builds
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/Nullstack README.md LICENSE docs/EARLY_ACCESS.md package/
          tar -czf NULLSTACK-back-room-linux-x64.tar.gz -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/Nullstack.exe,README.md,LICENSE,docs/EARLY_ACCESS.md package/
          Compress-Archive -Path package/* -DestinationPath NULLSTACK-back-room-windows-x64.zip
      - name: Build and test pinned Windows bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'NULLSTACK-back-room-windows-x64.zip'
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.1.0-alpha.${{ github.run_number }}/NULLSTACK-back-room-windows-x64.zip"
          cmake -S . -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DNULLSTACK_SETUP_URL=$url" "-DNULLSTACK_SETUP_SHA256=$hash"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target NullstackSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/Release/NullstackSetup.exe ./NullstackSetup.exe
          $destination = Join-Path $PWD 'setup-test'
          $args = @('/S', '/no-shortcut', "`"/archive=$zip`"", "`"/D=$destination`"")
          $process = Start-Process -FilePath (Join-Path $PWD 'NullstackSetup.exe') -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$destination/Nullstack.exe")) { throw 'Installer test failed' }
          & "$destination/Nullstack.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed game failed to run' }
          if ((Get-FileHash "$destination/Nullstack.exe").Hash -ne (Get-FileHash 'build/Release/Nullstack.exe').Hash) { throw 'Installed executable mismatch' }
          $bad = Join-Path $PWD 'bad.zip'
          Set-Content $bad 'not a verified payload'
          $badDest = Join-Path $PWD 'bad-install'
          $args = @('/S', '/no-shortcut', "`"/archive=$bad`"", "`"/D=$badDest`"")
          $process = Start-Process -FilePath (Join-Path $PWD 'NullstackSetup.exe') -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -eq 0 -or (Test-Path "$badDest/Nullstack.exe")) { throw 'Tampered payload was not rejected' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            NULLSTACK-back-room-*
            NullstackSetup.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish early-access release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.1.0-alpha.${{ github.run_number }}" \
            artifacts/linux-x64/*.tar.gz artifacts/windows-x64/*.zip artifacts/windows-x64/NullstackSetup.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "NULLSTACK: Back Room (early access)" \
            --notes "A small playable terminal scenario for Windows x64 and Linux x64. On Windows, run NullstackSetup.exe to download and install the game, or extract the ZIP and launch Nullstack.exe. On Linux extract the archive and run ./Nullstack in a terminal. Type help for controls and goals. This is not the full planned game: no campaign, graphical interface, scenario saves, uninstaller, or self-updater. The Windows executable is unsigned and may trigger SmartScreen. Builds and tests ran on GitHub Actions."
  verify-download-install:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download installer and install from the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "v0.1.0-alpha.${{ github.run_number }}" --pattern NullstackSetup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not download installer' }
          $destination = Join-Path $PWD 'installed-game'
          $args = @('/S', '/no-shortcut', "`"/D=$destination`"")
          $process = Start-Process -FilePath (Join-Path $PWD 'NullstackSetup.exe') -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$destination/Nullstack.exe")) { throw 'Online installation failed' }
          & "$destination/Nullstack.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed game failed to run' }
