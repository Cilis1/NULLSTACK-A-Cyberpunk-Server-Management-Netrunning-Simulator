name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, cxx: g++, config: Debug}
          - {os: ubuntu-latest, cc: gcc, cxx: g++, config: Release}
          - {os: ubuntu-latest, cc: clang, cxx: clang++, config: Debug}
          - {os: ubuntu-latest, cc: clang, cxx: clang++, config: Release}
          - {os: windows-latest, cc: cl, cxx: cl, config: Debug}
          - {os: windows-latest, cc: cl, cxx: cl, config: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
